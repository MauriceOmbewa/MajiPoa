<!-- ==========================================================================
     MajiSafi - Shared Customer Navbar Component
     ========================================================================== -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#DBE7F1] shadow-xs">
  <div class="max-w-[1180px] mx-auto px-5 h-[68px] flex items-center justify-between gap-4">

    <!-- Brand Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 no-underline group">
      <svg class="w-7 h-7 shrink-0 transition-transform group-hover:scale-105" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5S4.5 11 4.5 15.4A7.5 7.5 0 0 0 19.5 15.4C19.5 11 12 2.5 12 2.5Z" fill="url(#navBrandGrad)"/>
        <defs>
          <linearGradient id="navBrandGrad" x1="4" y1="3" x2="20" y2="21">
            <stop stop-color="#2FC4C0"/>
            <stop offset="1" stop-color="#1877D2"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="font-['Bricolage_Grotesque'] font-bold text-[22px] tracking-tight text-[#07243D]">
        Maji<span class="text-[#1877D2]">Safi</span>
      </span>
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center gap-1">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }"
          [class]="rla.isActive
            ? 'px-3.5 py-2 rounded-full text-[14.5px] font-medium bg-[#07243D] text-white hover:bg-[#0F3A5C] transition no-underline'
            : 'px-3.5 py-2 rounded-full text-[14.5px] font-medium text-[#0F3A5C] hover:bg-[#F1F6FA] transition no-underline'">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Right Actions -->
    <div class="flex items-center gap-2.5 sm:gap-3">

      <!-- Cart Button -->
      <button
        type="button"
        (click)="navigateToCart()"
        class="relative w-10 h-10 rounded-full border border-[#DBE7F1] bg-white flex items-center justify-center hover:bg-[#F1F6FA] transition cursor-pointer text-[#07243D]"
        aria-label="Shopping Cart">
        <span class="text-base">🛒</span>
      </button>

      <!-- Sign In -->
      <button
        type="button"
        (click)="navigateToSignIn()"
        class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-[#DBE7F1] bg-white text-[14px] font-semibold text-[#07243D] hover:bg-[#F1F6FA] transition cursor-pointer">
        Sign in
      </button>
    </div>

  </div>
</header>
