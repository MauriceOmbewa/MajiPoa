<!-- Customer-facing top navbar. Visible on all customer pages. -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-[#DBE7F1] shadow-xs">
  <div class="max-w-[1180px] mx-auto px-5 h-[68px] flex items-center justify-between gap-4">

    <!-- ── Brand ────────────────────────────────────────────────────────── -->
    <a routerLink="/home" class="flex items-center gap-2.5 no-underline group shrink-0">
      <svg class="w-7 h-7 shrink-0 transition-transform group-hover:scale-105" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5S4.5 11 4.5 15.4A7.5 7.5 0 0 0 19.5 15.4C19.5 11 12 2.5 12 2.5Z" fill="url(#navBrandGrad)"/>
        <defs>
          <linearGradient id="navBrandGrad" x1="4" y1="3" x2="20" y2="21">
            <stop stop-color="#2FC4C0"/><stop offset="1" stop-color="#1877D2"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="font-['Bricolage_Grotesque'] font-bold text-[22px] tracking-tight text-[#07243D]">
        Maji<span class="text-[#1877D2]">Safi</span>
      </span>
    </a>

    <!-- ── Desktop Nav ───────────────────────────────────────────────────── -->
    <nav class="hidden md:flex items-center gap-1">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive #rla="routerLinkActive"
           [routerLinkActiveOptions]="{ exact: false }"
           [class]="rla.isActive
             ? 'px-3.5 py-2 rounded-full text-[14.5px] font-medium bg-[#07243D] text-white no-underline'
             : 'px-3.5 py-2 rounded-full text-[14.5px] font-medium text-[#0F3A5C] hover:bg-[#F1F6FA] transition no-underline'">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- ── Right Actions ─────────────────────────────────────────────────── -->
    <div class="flex items-center gap-2.5">

      <!-- Cart -->
      <button type="button" (click)="navigateToCart()"
        class="relative w-10 h-10 rounded-full border border-[#DBE7F1] bg-white flex items-center justify-center hover:bg-[#F1F6FA] transition cursor-pointer text-[#07243D]"
        aria-label="Cart">
        <span class="text-base">🛒</span>
      </button>

      <!-- ── Authenticated user menu ────────────────────────────────────── -->
      @if (auth.isLoggedIn()) {
        <div class="relative">

          <!-- Trigger: avatar + mode pill -->
          <button type="button" (click)="toggleMenu()"
            class="flex items-center gap-2 pl-1.5 pr-2.5 py-1 rounded-full border border-[#DBE7F1] bg-white hover:bg-[#F1F6FA] transition cursor-pointer">

            <!-- Avatar -->
            @if (userPicture()) {
              <img [src]="userPicture()!" [alt]="firstName()"
                class="w-7 h-7 rounded-full object-cover shrink-0" referrerpolicy="no-referrer"/>
            } @else {
              <span class="w-7 h-7 rounded-full bg-[#07243D] text-white text-[11px] font-bold flex items-center justify-center shrink-0">
                {{ userInitials() }}
              </span>
            }

            <!-- Active mode pill -->
            <span class="text-[13px] font-semibold text-[#07243D] hidden sm:block">{{ modeLabel() }}</span>
            <svg class="w-3.5 h-3.5 text-[#5E7489] transition-transform"
              [class.rotate-180]="menuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>

          <!-- Dropdown -->
          @if (menuOpen()) {
            <!-- Backdrop to close on outside click -->
            <div class="fixed inset-0 z-40" (click)="closeMenu()"></div>

            <div class="absolute right-0 top-[calc(100%+8px)] z-50 w-[240px] bg-white border border-[#DBE7F1] rounded-2xl shadow-xl overflow-hidden">

              <!-- User info -->
              <div class="px-4 py-3 border-b border-[#F1F6FA]">
                <p class="text-[13.5px] font-semibold text-[#07243D] truncate">{{ auth.user()?.name }}</p>
                <p class="text-[12px] text-[#5E7489] truncate">{{ auth.user()?.email }}</p>
              </div>

              <!-- Mode switcher section -->
              <div class="px-3 py-2">
                <p class="text-[11px] font-semibold text-[#7FA0BB] uppercase tracking-wide px-1 mb-1.5">Switch mode</p>

                <!-- Customer mode — always available -->
                <button type="button" (click)="switchMode('CUSTOMER')"
                  [class]="roles.isCustomerMode()
                    ? 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-semibold bg-[#07243D] text-white'
                    : 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-medium text-[#07243D] hover:bg-[#F1F6FA] transition'">
                  <span class="text-base">🛍</span>
                  <span>Customer</span>
                  @if (roles.isCustomerMode()) {
                    <span class="ml-auto text-[11px] bg-white/20 px-1.5 py-0.5 rounded-full">Active</span>
                  }
                </button>

                <!-- Vendor mode -->
                <button type="button" (click)="switchMode('VENDOR')"
                  [class]="roles.isVendorMode()
                    ? 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-semibold bg-[#07243D] text-white'
                    : 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-medium text-[#07243D] hover:bg-[#F1F6FA] transition'">
                  <span class="text-base">🏪</span>
                  <span>Vendor portal</span>
                  @if (roles.isVendorMode()) {
                    <span class="ml-auto text-[11px] bg-white/20 px-1.5 py-0.5 rounded-full">Active</span>
                  }
                  @if (!auth.hasVendorRole()) {
                    <span class="ml-auto text-[11px] text-[#1877D2] font-semibold">Join →</span>
                  }
                </button>

                <!-- Rider mode -->
                <button type="button" (click)="switchMode('RIDER')"
                  [class]="roles.isRiderMode()
                    ? 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-semibold bg-[#07243D] text-white'
                    : 'w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-medium text-[#07243D] hover:bg-[#F1F6FA] transition'">
                  <span class="text-base">🚴</span>
                  <span>Rider portal</span>
                  @if (roles.isRiderMode()) {
                    <span class="ml-auto text-[11px] bg-white/20 px-1.5 py-0.5 rounded-full">Active</span>
                  }
                  @if (!auth.hasRiderRole()) {
                    <span class="ml-auto text-[11px] text-[#1877D2] font-semibold">Join →</span>
                  }
                </button>
              </div>

              <!-- Sign out -->
              <div class="px-3 pb-3 pt-1 border-t border-[#F1F6FA]">
                <button type="button" (click)="signOut()"
                  class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[13.5px] font-medium text-[#D6453C] hover:bg-[#FDF5F5] transition">
                  <span class="text-base">↩</span>
                  <span>Sign out</span>
                </button>
              </div>
            </div>
          }
        </div>

      } @else {
        <!-- ── Not logged in ───────────────────────────────────────────── -->
        <button type="button" (click)="signIn()"
          class="hidden sm:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-[#DBE7F1] bg-white text-[14px] font-semibold text-[#07243D] hover:bg-[#F1F6FA] transition cursor-pointer">
          Sign in
        </button>
      }

    </div>
  </div>
</header>
